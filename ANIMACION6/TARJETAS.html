<html>
<head>
    <title>Lenguajes Caracterizados</title>

    <style>

        *{
            margin:0;
            padding:0;
        }
        .inicio{
            height: 50px;
            width: 100px;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body{
            padding-top:100px;
            background:black;
        }

        .contenedor{
            width:800px;
            height:300px;
            border:1px solid black;
            margin:0 auto;
            position:relative;
          

        }

        .tarjeta1,.tarjeta2,.tarjeta3,.tarjeta4{

            width:200px;
            height:300px;
            position:absolute;
            background-size:cover;
            
        }

        .tarjeta1{
            background-image:url(img/html.jpg);
            left:-1000px;
            animation:tarjeta1 3s forwards;
        }

        .tarjeta2{
            background-image:url(img/css.jpg);
            left:200px;
            top:-1000px;
            animation:tarjeta2 3s forwards 3s;
        }

        .tarjeta3{
            background-image:url(img/js.jpg);
            left:1400px;
            animation:tarjeta3 3s forwards 6s;
        }
        .tarjeta4{
            background-image:url(img/bo.jpg);
            left:600px;
            top:-1000px;
            animation:tarjeta4 3s forwards 9s;
        }

        /* LAS RICAS ANIMACIONES*/   
            @keyframes tarjeta1 {
                0%{ left: -600px; transform: rotateY(180deg); }
                50%{ left: 200px; }
                100%{ left: 0px; transform: rotateY(0deg); }
            }

            @keyframes tarjeta2 {
                0%{ top: -600px; transform: rotateY(180deg); }
                50%{ top: 400px; }
                100%{ top: 0px; transform: rotateY(0deg); }
            }

            @keyframes tarjeta3 {
                0%{ left: 1000px; transform: rotateY(180deg); }
                50%{ left: 200px; }
                100%{ left: 400px; transform: rotateY(0deg); }
            }

            @keyframes tarjeta4 {
                0%{ top: -600px; transform: rotateY(180deg); }
                50%{ top: 400px; }
                100%{ top: 0px; transform: rotateY(0deg); }
            }

            /*EVENTEISHONS*/
            .tarjeta1:hover, .tarjeta2:hover, .tarjeta3:hover, .tarjeta4:hover {
                scale: 1.2; 
                z-index: 1;
                transition: 1s;
            }

    </style>

</head>

<body>
    <div class="inicio"><a href="../index.html">Patras</a></div>

    <div class="contenedor">
        <div class="tarjeta1"></div>
        <div class="tarjeta2"></div>
        <div class="tarjeta3"></div>
        <div class="tarjeta4"></div>
    </div>

</body>
</html>
